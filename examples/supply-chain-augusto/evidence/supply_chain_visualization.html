  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;supply-chain-results&quot;);
      const data = {
        baseline: {
          label: &quot;message_drop 0.00&quot;,
          sends: 60,
          receives: 60,
          dropped: 0,
          rate: 1,
          edges: [
            { from: &quot;supplier-0&quot;, to: &quot;manufacturer-0&quot;, send: 15, receive: 15, dropped: 0 },
            { from: &quot;manufacturer-0&quot;, to: &quot;distributor-0&quot;, send: 15, receive: 15, dropped: 0 },
            { from: &quot;distributor-0&quot;, to: &quot;retailer-0&quot;, send: 15, receive: 15, dropped: 0 },
            { from: &quot;retailer-0&quot;, to: &quot;supplier-0&quot;, send: 15, receive: 15, dropped: 0 }
          ],
          drops: []
        },
        edited: {
          label: &quot;message_drop 0.01&quot;,
          sends: 57,
          receives: 55,
          dropped: 2,
          rate: 55 / 57,
          edges: [
            { from: &quot;supplier-0&quot;, to: &quot;manufacturer-0&quot;, send: 15, receive: 15, dropped: 0 },
            { from: &quot;manufacturer-0&quot;, to: &quot;distributor-0&quot;, send: 15, receive: 14, dropped: 1 },
            { from: &quot;distributor-0&quot;, to: &quot;retailer-0&quot;, send: 14, receive: 13, dropped: 1 },
            { from: &quot;retailer-0&quot;, to: &quot;supplier-0&quot;, send: 13, receive: 13, dropped: 0 }
          ],
          drops: [
            { from: &quot;manufacturer-0&quot;, to: &quot;distributor-0&quot;, msg: &quot;product:1:good-manufacturer-0-3&quot; },
            { from: &quot;distributor-0&quot;, to: &quot;retailer-0&quot;, msg: &quot;shipment:4:good-manufacturer-0-12&quot; }
          ]
        }
      };
      const pos = {
        &quot;supplier-0&quot;: { x: 115, label: &quot;Supplier&quot; },
        &quot;manufacturer-0&quot;: { x: 345, label: &quot;Manufacturer&quot; },
        &quot;distributor-0&quot;: { x: 575, label: &quot;Distributor&quot; },
        &quot;retailer-0&quot;: { x: 805, label: &quot;Retailer&quot; }
      };
      const width = 142;
      const lines = root.querySelector(&quot;[data-lines]&quot;);
      const labels = root.querySelector(&quot;[data-labels]&quot;);
      const nodes = root.querySelector(&quot;[data-nodes]&quot;);
      const volumeGrid = root.querySelector(&quot;[data-volume-grid]&quot;);
      const volumeLabels = root.querySelector(&quot;[data-volume-labels]&quot;);
      const volumeLine = root.querySelector(&quot;[data-volume-line]&quot;);
      const volumePoints = root.querySelector(&quot;[data-volume-points]&quot;);
      const table = root.querySelector(&quot;.edge-table&quot;);
      const details = root.querySelector(&quot;.details&quot;);
      const buttons = Array.from(root.querySelectorAll(&quot;button[data-run]&quot;));
      const metric = (name) =&gt; root.querySelector(&quot;[data-metric=&#x27;&quot; + name + &quot;&#x27;]&quot;);

      function pathFor(edge) {
        const from = pos[edge.from];
        const to = pos[edge.to];
        if (edge.to === &quot;supplier-0&quot;) {
          return { d: &quot;M &quot; + (from.x - width / 2 + 2) + &quot; 184 C &quot; + (from.x - 55) + &quot; 315, &quot; + (to.x + 55) + &quot; 315, &quot; + (to.x + width / 2 - 2) + &quot; 184&quot;, x: 460, y: 307 };
        }
        return { d: &quot;M &quot; + (from.x + width / 2 - 2) + &quot; 155 L &quot; + (to.x - width / 2 + 2) + &quot; 155&quot;, x: (from.x + to.x) / 2, y: 132 };
      }

      function renderNodes() {
        nodes.innerHTML = Object.keys(pos).map((id) =&gt; {
          const item = pos[id];
          return &quot;&lt;g transform=&#x27;translate(&quot; + (item.x - width / 2) + &quot;,133)&#x27;&gt;&lt;rect class=&#x27;node-box&#x27; width=&#x27;&quot; + width + &quot;&#x27; height=&#x27;44&#x27; rx=&#x27;5&#x27;&gt;&lt;/rect&gt;&lt;text class=&#x27;node-label&#x27; x=&#x27;&quot; + (width / 2) + &quot;&#x27; y=&#x27;19&#x27; text-anchor=&#x27;middle&#x27;&gt;&quot; + item.label + &quot;&lt;/text&gt;&lt;text class=&#x27;node-id&#x27; x=&#x27;&quot; + (width / 2) + &quot;&#x27; y=&#x27;35&#x27; text-anchor=&#x27;middle&#x27;&gt;&quot; + id + &quot;&lt;/text&gt;&lt;/g&gt;&quot;;
        }).join(&quot;&quot;);
      }

      function renderVolume(run) {
        const xs = [150, 370, 590, 810];
        const y = (value) =&gt; 156 - (value / 15) * 120;
        volumeGrid.innerHTML = [0, 5, 10, 15].map((value) =&gt; &quot;&lt;line class=&#x27;grid&#x27; x1=&#x27;75&#x27; x2=&#x27;855&#x27; y1=&#x27;&quot; + y(value) + &quot;&#x27; y2=&#x27;&quot; + y(value) + &quot;&#x27;&gt;&lt;/line&gt;&lt;text x=&#x27;62&#x27; y=&#x27;&quot; + (y(value) + 4) + &quot;&#x27; text-anchor=&#x27;end&#x27;&gt;&quot; + value + &quot;&lt;/text&gt;&quot;).join(&quot;&quot;);
        volumeLabels.innerHTML = &quot;&lt;text class=&#x27;axis-title&#x27; x=&#x27;16&#x27; y=&#x27;92&#x27; transform=&#x27;rotate(-90 16 92)&#x27; text-anchor=&#x27;middle&#x27;&gt;Delivered&lt;/text&gt;&quot; + [&quot;S -&gt; M&quot;, &quot;M -&gt; D&quot;, &quot;D -&gt; R&quot;, &quot;R -&gt; S&quot;].map((label, index) =&gt; &quot;&lt;text x=&#x27;&quot; + xs[index] + &quot;&#x27; y=&#x27;181&#x27; text-anchor=&#x27;middle&#x27;&gt;&quot; + label + &quot;&lt;/text&gt;&quot;).join(&quot;&quot;);
        const points = run.edges.map((edge, index) =&gt; xs[index] + &quot;,&quot; + y(edge.receive)).join(&quot; &quot;);
        volumeLine.setAttribute(&quot;d&quot;, &quot;M &quot; + points.replace(/ /g, &quot; L &quot;));
        volumePoints.innerHTML = run.edges.map((edge, index) =&gt; &quot;&lt;circle class=&#x27;volume-point&#x27; cx=&#x27;&quot; + xs[index] + &quot;&#x27; cy=&#x27;&quot; + y(edge.receive) + &quot;&#x27; r=&#x27;6&#x27;&gt;&lt;title&gt;&quot; + edge.receive + &quot; delivered&lt;/title&gt;&lt;/circle&gt;&lt;text x=&#x27;&quot; + xs[index] + &quot;&#x27; y=&#x27;&quot; + (y(edge.receive) - 12) + &quot;&#x27; text-anchor=&#x27;middle&#x27;&gt;&quot; + edge.receive + &quot;&lt;/text&gt;&quot;).join(&quot;&quot;);
      }

      function render(runName) {
        const run = data[runName];
        buttons.forEach((button) =&gt; button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.run === runName)));
        root.querySelector(&quot;.run-label&quot;).textContent = run.label;
        metric(&quot;sends&quot;).textContent = run.sends;
        metric(&quot;receives&quot;).textContent = run.receives;
        metric(&quot;rate&quot;).textContent = (run.rate * 100).toFixed(1) + &quot;%&quot;;
        metric(&quot;dropped&quot;).textContent = run.dropped;
        renderVolume(run);
        lines.innerHTML = run.edges.map((edge) =&gt; {
          const p = pathFor(edge);
          return &quot;&lt;path class=&#x27;edge-line&quot; + (edge.dropped ? &quot; drop&quot; : &quot;&quot;) + &quot;&#x27; d=&#x27;&quot; + p.d + &quot;&#x27;&gt;&lt;/path&gt;&quot; + (edge.dropped ? &quot;&lt;circle class=&#x27;drop-dot&#x27; cx=&#x27;&quot; + p.x + &quot;&#x27; cy=&#x27;&quot; + p.y + &quot;&#x27; r=&#x27;7&#x27;&gt;&lt;/circle&gt;&quot; : &quot;&quot;);
        }).join(&quot;&quot;);
        labels.innerHTML = run.edges.map((edge) =&gt; {
          const p = pathFor(edge);
          const label = edge.receive + &quot;/&quot; + edge.send + &quot; delivered&quot; + (edge.dropped ? &quot;, &quot; + edge.dropped + &quot; dropped&quot; : &quot;&quot;);
          return &quot;&lt;text class=&#x27;edge-label&quot; + (edge.dropped ? &quot; drop&quot; : &quot;&quot;) + &quot;&#x27; x=&#x27;&quot; + p.x + &quot;&#x27; y=&#x27;&quot; + p.y + &quot;&#x27; text-anchor=&#x27;middle&#x27;&gt;&quot; + label + &quot;&lt;/text&gt;&quot;;
        }).join(&quot;&quot;);
        table.querySelectorAll(&quot;.data-row&quot;).forEach((row) =&gt; row.remove());
        run.edges.forEach((edge) =&gt; {
          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;data-row&quot;;
          row.setAttribute(&quot;role&quot;, &quot;row&quot;);
          row.innerHTML = &quot;&lt;div role=&#x27;cell&#x27;&gt;&quot; + edge.from.replace(&quot;-0&quot;, &quot;&quot;) + &quot; -&gt; &quot; + edge.to.replace(&quot;-0&quot;, &quot;&quot;) + &quot;&lt;/div&gt;&lt;div class=&#x27;num&#x27; role=&#x27;cell&#x27;&gt;&quot; + edge.send + &quot;&lt;/div&gt;&lt;div class=&#x27;num&#x27; role=&#x27;cell&#x27;&gt;&quot; + edge.receive + &quot;&lt;/div&gt;&lt;div class=&#x27;num&quot; + (edge.dropped ? &quot; drop&quot; : &quot;&quot;) + &quot;&#x27; role=&#x27;cell&#x27;&gt;&quot; + edge.dropped + &quot;&lt;/div&gt;&quot;;
          table.appendChild(row);
        });
        details.innerHTML = run.drops.length ? &quot;&lt;strong&gt;&quot; + run.drops.length + &quot; dropped messages:&lt;/strong&gt; &quot; + run.drops.map((drop) =&gt; &quot;&lt;code&gt;&quot; + drop.from + &quot; -&gt; &quot; + drop.to + &quot;: &quot; + drop.msg + &quot;&lt;/code&gt;&quot;).join(&quot;; &quot;) : &quot;No dropped messages&quot;;
      }

      renderNodes();
      buttons.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; render(button.dataset.run)));

&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);

    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
